<script>
/* ---------- choice / read screen wiring + analytics ---------- */
(function(){
  var choice  = document.getElementById('fsw-choice');
  var mount   = document.getElementById('fsw-mount');

  // ---- analytics state ----
  var modeEnterTime = null;     // when current mode (read) started
  var currentMode = 'landing';  // 'landing' | 'read'

  function secondsSince(ts){ return ts ? Math.round((Date.now() - ts)/1000) : 0; }

  function leaveMode(){
    if(currentMode === 'read' && modeEnterTime){
      var rs = secondsSince(modeEnterTime);
      if(rs > 0 && rs < 3600){ // sanity cap: ignore stale/garbage timers over 1hr
        window.track && window.track('read_session_end', { seconds_in_read: rs });
      }
    }
    modeEnterTime = null; // always clear after leaving, prevents double-fire/double-count
  }
  function enterMode(name){
    leaveMode();
    currentMode = name;
    modeEnterTime = (name === 'landing') ? null : Date.now();
  }
  window.addEventListener('pagehide', leaveMode);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      leaveMode();
    } else if(document.visibilityState === 'visible' && currentMode && currentMode !== 'landing' && !modeEnterTime){
      modeEnterTime = Date.now();
    }
  });

  function showRead(){
    choice.classList.add('hidden');
    mount.style.display = 'block';
    if(window.__fswStart){ window.__fswStart(); }
    enterMode('read');
    window.track && window.track('choice_made', { mode: 'read' });
  }

  document.getElementById('pick-read').addEventListener('click', showRead);

  // first event: page open
  window.track && window.track('story_opened');
})();
</script>

<script>
!function(){if(!window.__fswI){window.__fswI=!0;var e=document.getElementById("fsw-mount");if(e){var t=e.attachShadow({mode:"closed"}),n={title:"milKit",tagline:"How a Swiss engineer who rode Alaska to Patagonia on a recumbent turned a dried out tire in Colorado into the system that fixed tubeless maintenance.",chapters:[{title:"Alaska to Tierra del Fuego on a Recumbent",beats:["#Pius Kobler grew up in Switzerland cycling 12 miles to school every day from age 14. His family went on bike trips during holidays. He studied mechanical engineering at ETH Zurich, one of the top technical universities in Europe.","After graduating, he took his recumbent bicycle and rode it from Alaska to Tierra del Fuego for a year and a half. When Americans saw him on the recumbent, they would stop and ask: but you're not handicapped, why are you riding one of these?","He chose the recumbent for engineering reasons. ^'No pain in your wrists, neck, or butt. A third less wind drag. Lower center of gravity. Better curve stability. And you're sitting open, like on a couch, riding through the countryside.'`","After the trip, a friend got him into mountain biking. He joined a product development company in Switzerland, a design bureau that developed products as a service for large companies including Scott and BMC. ^'You could say we were professional inventors.'`"]},{title:"Dried Out in Colorado",beats:["#In the summer of 2013, Pius took an unpaid leave from work and bought a van in the US. He drove it from one IMBA epic trail to the next for eight weeks. ^'I might have ridden more trails in the US than most Americans.'`","They went to Colorado and Utah in July. 120 degrees. Their tubeless tires dried out completely because the heat evaporated all the sealant. In the middle of nowhere on the Continental Divide, Pius had to pull the tire apart and put a tube in. Every cyclist who rides tubeless hates that moment.","That's when the idea hit. ^'If I'm a bike freak and a tech developer and I have this problem of not being able to maintain my sealant, how do other people do it?'`","The answer: they don't. Most riders have no idea how much sealant is left in their tires. They find out when they get a puncture and nothing seals. ^'You can split tubeless riders into those who know they have to maintain their sealant and those who find out later.'`"]},{title:"The Valve with Rubber Flaps",beats:["#The first idea was to drill a second hole in the rim. Then they realized they had to work through the hole that was already there: the valve. The first concept was a dipstick. Then, by accident during prototyping, they discovered something better.","They designed a tubeless valve with a rubber foot that has self closing flaps at the bottom, like the top of a ketchup bottle. When you unscrew the valve core, the air stays in the tire because the flaps seal shut.","Then you push a syringe with a flexible needle through the rubber flaps into the tire. The air pressure inside the tire automatically pushes the sealant into the syringe. You don't even have to suck it out. ^'You can see exactly how much sealant remains. Then you just push it back in or top it up with fresh sealant.'`","The breakthrough had three benefits nobody had planned for. First: measure and refill sealant in two minutes without spilling a drop. Second: install a tire dry, inflate it first, then add sealant through the valve afterward, eliminating the messy part entirely. Third: sealant never reaches the valve core, so valve cores never clog. ^'You can install and maintain a tubeless tire without ever seeing a drop of sealant.'`"]},{title:"The Side Hustle That Couldn't Stay Small",beats:["#The original plan was to develop the system and sell it through an online store while keeping his day job at the product development company. ^'That sounds a bit naive now looking back, but that was the plan.'`","Step by step, he realized you had to do it properly or not at all. In summer 2014, he quit his job and started bootstrapping. His co founder had already started a startup before, which helped with credibility. Pius was the ETH engineer and bike obsessive. ^'That was a good mix.'`","Switzerland has a strong startup support ecosystem. They won several startup prizes because the story was compelling. In 2015, they incorporated the company and raised a financing round to get production started.","^'Any business that involves inventory, there's so much additional risk. You're not perfectly independent from the beginning because you already have shareholders that you have to justify everything to. The pressure is on from the first minute.'`"]},{title:"Italy, Portugal, Then Germany",beats:["#They started manufacturing near the Italian border in southern Switzerland, where you could get Italian manufacturing pricing with Swiss legal structure. Quality was fine. Logistics and organization were not.","Then they moved to Portugal, which everyone was calling the future of cycling industry manufacturing in Europe. ^'Which might be true, but only if you really know what you're doing when sourcing a manufacturing partner. We didn't entirely know.'`","They ran into quality problems. Their second product, an air booster for seating tubeless tires, had to be recalled right after launch. ^'You can imagine how that feels. You release your second product as a startup and you have to recall it from everywhere.'`","That recall was the darkest hour of the company. But it taught them the most important manufacturing lesson: ^'When you are an early stage startup, it's so much more important that production works than that it's cheap. The 20% more cost doesn't matter. Reliability matters.'`","They moved production to Germany and stayed there. Reliable, consistent, predictable. ^'For a long time, you can go for reliable over cheap. That's been super important for us.'`"]},{title:"The Ghetto Booster That Became a Real Product",beats:["#Every year, Pius and his team ride in Finale Ligure, Italy. One evening in a shed, they needed to change a tire. They had a floor pump but nothing else. The tire wouldn't seat.","Being product developers, they built a ghetto booster on the spot: a Coke bottle with a hole drilled in the cap, a bike valve inserted, a second hole with a tube and a kink to hold the air. They inflated the bottle, held it to the valve, and nearly managed to seat the tire. Nearly. They had to drive to a gas station.","That became the Tubeless Booster. They professionalized the concept into an aluminum drinking bottle with a plastic head that screws on. You inflate the bottle to 160 PSI with a floor pump, then press it onto the valve. Because there's no hose, no pressure is lost. The air rushes in instantly.","At Sea Otter, a bike magazine journalist watched the demo, said ^'holy shit,'` pulled out his phone, and filmed a 30 second video of the whole sequence. That video reached 3.2 million views within a year. It's now at 8.6 million. ^'The whole tubeless topic is something people don't want to think about, but there's enormous interest once they see a solution.'`"]},{title:"A Sealant That Doesn't Go Bad in the Bottle",beats:["#The original business plan was to build the brand on the patented valve system and booster, then sell consumables like rim tape and sealant. The sealant was supposed to be a commodity add on. It became its own sales driver.","Most sealants separate over time. The particles settle at the bottom of the bottle. You shake it, pour it in quickly, and hope you got the right ratio. Inside the tire, the same separation happens: you end up with rubbery balls of dried material and a puddle of watery liquid that seals nothing.","milKit's sealant stays homogeneous. No particles settle. No shaking required. ^'You just take it with the syringe and push it into your tire. It stays constant inside the tire too: no rubber balls, no watery separation. It just stays wet and functional.'`","This means two things for riders: the sealant works reliably for much longer between maintenance, and it doesn't go bad in the bottle. You can buy a bigger bottle and use it next year. ^'A lot of sealant gets thrown away because it goes bad in the bottle. That's an environmental impact and a financial one.'`"]},{title:"Lighter Than Your Phone",beats:["#The latest product started from one unsolved problem: cuts in the tire too big for sealant to seal. You need to push a plug through the hole from the outside. The question was where to store the plug tool so it's instantly accessible with one hand while your other hand is holding the tire.","They didn't want to go inside the handlebar or stem because of compatibility issues across bike brands. Instead, they designed a small box that mounts to the standard bottle cage screws on the frame. A rubber cover opens on the side. You pull out the plug tool with one hand.","Then they realized: if we already have this box on the frame, why not put a full multi tool in there too? The result: an L shaped hex key with magnetic interchangeable bits stored inside each other. Eight functions from 2 to 8 millimeter plus Torx 25, all in one tool that clips magnetically into a tire lever that stores a chain link and attaches to a chain breaker.","The entire kit weighs 83.5 grams. ^'Lighter than your phone.'` It mounts under a bottle cage with only half an inch of thickness. You can still mount your bottle on top. Pius used it nine times in four days during an Easter riding trip. ^'Not because I wanted to count higher. I actually needed it that many times.'`","=This story was assembled by <b>Andres Vanryckeghem</b>, founder of <b>Athlete Founders</b>. He analyses athlete entrepreneurs every day to help other athletes see the possibilities of their own projects, and to make their first steps very concrete based on all these learnings."]},]},o=["The Engineer on a Bike","The Problem","The Invention","Starting the Company","Manufacturing Lessons","The Booster","The Sealant","The Multi Tool"],a=0,i=0,r=
