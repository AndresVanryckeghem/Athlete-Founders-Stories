<script>
/* ---------- choice / read screen wiring + analytics ---------- */
(function(){
  var choice  = document.getElementById('fsw-choice');
  var mount   = document.getElementById('fsw-mount');

  // ---- analytics state ----
  var modeEnterTime = null;     // when current mode (read) started
  var currentMode = 'landing';  // 'landing' | 'read'

  function secondsSince(ts){ return ts ? Math.round((Date.now() - ts)/1000) : 0; }

  function leaveMode(){
    if(currentMode === 'read' && modeEnterTime){
      var rs = secondsSince(modeEnterTime);
      if(rs > 0 && rs < 3600){ // sanity cap: ignore stale/garbage timers over 1hr
        window.track && window.track('read_session_end', { seconds_in_read: rs });
      }
    }
    modeEnterTime = null; // always clear after leaving, prevents double-fire/double-count
  }
  function enterMode(name){
    leaveMode();
    currentMode = name;
    modeEnterTime = (name === 'landing') ? null : Date.now();
  }
  window.addEventListener('pagehide', leaveMode);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      leaveMode();
    } else if(document.visibilityState === 'visible' && currentMode && currentMode !== 'landing' && !modeEnterTime){
      modeEnterTime = Date.now();
    }
  });

  function showRead(){
    choice.classList.add('hidden');
    mount.style.display = 'block';
    if(window.__fswStart){ window.__fswStart(); }
    enterMode('read');
    window.track && window.track('choice_made', { mode: 'read' });
  }

  document.getElementById('pick-read').addEventListener('click', showRead);

  // first event: page open
  window.track && window.track('story_opened');
})();
</script>

<script>
!function(){if(!window.__fswI){window.__fswI=!0;var e=document.getElementById("fsw-mount");if(e){var t=e.attachShadow({mode:"closed"}),n={title:"Stride",tagline:"How a time trial specialist with hemophilia turned 12 years of racing knowledge into a coaching platform anyone can afford.",chapters:[{title:"The Kid They Wouldn't Let Play",beats:["#Alex Dowsett was born in the UK with severe hemophilia. His blood is missing Factor VIII, one of thirteen steps needed to form a clot. Without medication, a bruise could become an internal bleed that feels like a broken bone.","For his first 18 months, his parents kept telling doctors something was wrong. He bruised from the lightest touch. Two black thumbprints across his chest from being picked up. The doctors sent them away, saying he's just a baby.","His mother demanded blood tests. On the way out, he split the skin between his gum and his upper lip. His parents put him to bed. It seemed to be stopping. They checked on him in the night. He was asleep in a pool of blood. The clot had formed and broken down, formed and broken down, in a cycle that wouldn't end.","An ambulance came. The doctor said: I think he has hemophilia. Blood results confirmed it days later. The original doctor who had dismissed his parents apologized. ^'He said, I've made a mistake here. I'm going to learn from this. I'm going to listen to a mother's intuition more.'`","At school, rugby was off the table. Football was off the table. Those are the two staple sports in English schools. He was made a football referee once. ^'That is about the fastest way to unpopularity there is.'`","His parents didn't say no to sport. They said: you can't do this, but let's go try this instead. Swimming five or six times a week, because doctors said it worked every joint and muscle with the lowest risk. Sailing in winter, cracking ice on the lake. Basketball. Athletics.","His father, a former race car driver, told him: ^'There is a Michael Schumacher level race car driver walking down the local high street right now, but unless they get the chance to try, it would just be unrealized potential.'` Alex believed there was a sport he was good at. He was determined to find it."]},{title:"The 28 Minute Time Trial",beats:["#His father's windsurfing friends all went through a collective midlife crisis and started mountain biking. When Alex was 11, he asked to join. His dad took him into the woods, but first they had to ride up a hill. He got to the top and threw up.","At 13, he asked his dad's friend Eric Smith if he could borrow a road bike. It was an alloy Eddy Merckx with Campagnolo Chorus. He went to watch Eric's son race a 10 mile time trial. A week later, he did one himself. ^16 kilometers, 28 minutes and one second.`","A year later, he qualified for the Schoolboy National Finals for riders up to 17. He qualified badly, rode a fixed wheel TT bike because he'd been told to learn to pedal properly instead of using gears to make things easier. He was sent off early and posted the fastest time.","The leaderboard: 16 year old Ian Stanhardt first, 14 year old Dowsett second, then the rest of the top ten all 16 year olds. ^'I looked at that and I was like, I found it. I found what I'm good at.'`","He told his doctors he'd taken up cycling. ^'They said, we'd rather you play chess or a musical instrument.'` It was new ground for hemophiliacs. There was no precedent. He became the first and only elite athlete with severe hemophilia in able bodied sport."]},{title:"The School That Opened the Gym",beats:["#He got into a top tier state school that prided itself on exam results. They knew he wasn't going to university. He was going straight to race for Team GB in Italy. They accommodated him anyway.","They let him take one less subject. They opened the gym at lunchtime so he could bring his bike in and train. A PE teacher found out years later that when he was hired, the head of PE told him: ^'This is your job, this is your schedule, and one more thing, you need to open the gym at lunch so Alex Dowsett can train.'` There were 800 kids in the school.","His parents had a brilliant mechanism. He wanted to do the 6 AM swim sessions. They said: ^'Fine. You wake us up. You set your alarm, you come knock on our door, and we'll take you.'` They never pushed. The effort had to come from him. About 25% of the sessions, he didn't wake up for.","His sister wanted a horse. His parents said: prove you can look after someone else's horse for a month. She lasted a couple of days of early mornings. ^'She said, I don't want a horse. But it would have been there for her if she did.'`","Alex now has two daughters, Juliet and Vivienne. He catches himself wanting to push. His four year old stopped wanting to do the weekly Park Run. He has to remind himself: ^'Alex, she is four years old. None of this matters.'` He keeps three rules in his head: he was terrible at sport until he found cycling, research says kids who specialize early have lower chances of making it, and his parents' example of the little shove followed by letting it come from the child."]},{title:"Five Teams in Twelve Years",beats:["#He turned professional with Team Sky. In his first year, he was consistently competitive. Sky was the perfect place to learn, but when the Giro came around, they sent Bradley Wiggins instead and told Alex he lacked experience. ^'I saw there was no place for me there.'`","Movistar came calling. At Sky, if you weren't at a 7 o'clock meeting by 6:50, you were late. At Movistar, if you showed up at 7, you were the only one. At Katusha later, 7 o'clock meant 7 o'clock.","Movistar's organized chaos shocked him. A team time trial with no written plan, the riding order decided as they rolled to the start ramp. They finished second, ahead of Sky. ^'Up until the moment I saw the result, I thought this was a total disaster. And then I realized: they knew how to race.'`","He spent three years at Movistar as the number one ranked team in the world. Then Katusha. Then Israel Premier Tech. The constant through all five teams: managing hemophilia alongside racing. Movistar asked him what to do when he crashes. ^'I said, if I can carry on, I will. If I can't, probably need to go to hospital. They said, right, so just like anyone else on the team.'`","His medication schedule was tied to risk. Training day on the road: high risk, inject beforehand. Rest day on the sofa: low risk, skip it. ^'Every day my risk assessment changed based on what I was doing.'`"]},{title:"The Win That Made Him Lazy",beats:["#In 2013, on his eighth Grand Tour stage ever, he won a 55 kilometer time trial at the Giro d'Italia. He beat Bradley Wiggins. He was in his early twenties.","It was probably the worst thing that happened to him. ^'I then spent a couple of years thinking I was one of the best time trialists in the world. Because that win had come relatively easy, too easy really.'`","The game overtook him. Other riders invested in aerodynamics, wind tunnels, skin suit development. He stood still. ^'It wasn't the training. It was the pushing forward with everything else. I was like, well, this is all going to come to me now, rather than me having to go fight for it.'`","People kept telling him about his potential. Cavendish told him he'd be World Time Trial Champion one day. Geraint Thomas messaged him after the Giro win saying: ^'I've done a hundred and something Grand Tour stages and not managed to win one. And you've gone and done it eight in. Well done.'` Alex thought: this was pretty easy, so this is probably going to happen a lot more. It didn't."]},{title:"The Win He Needed to Survive",beats:["#By 2020, everything was on the line. His wife Chanel was pregnant with their first child. He didn't have a contract for the next year. They'd moved countries, from the UK to a 55 square meter apartment on top of a mountain in Andorra, specifically to improve his cycling.","During COVID, he watched all of his teammates get contract extensions. Silence from the team to him and his manager. Then the UCI letter arrived saying the team was not renewing. A phone call followed: we still might, but there's only two spots left.","He woke up on stage 8 of the Giro and tweeted about accidentally brushing his teeth before drinking his coffee. ^'I hope my day gets better than this.'` It was a road stage. He did not win road races.","Two riders from his team got into the breakaway. He won the stage. It was the first ever Grand Tour stage win for Israel Premier Tech. ^'I had reconfirmed to myself that this was a sport I was very good at. Which throws back to my childhood, where it was like, found the sport I was good at.'`","The contract came days later. It wasn't a good offer because his back was against the wall. But it was two more years. ^'None of the emotion was fabricated. This is exactly how involved this situation was. So I told it exactly how it was, because anything else would be a lie.'`","Matt Stephens, the commentator, was on air when Alex crossed the line. He had to turn off his microphone. ^'I was welling up. I knew how much that win meant, not just the result, but how significant an impact it meant for his life for the next two years, supporting his family.'`"]},{title:"Power Meters Have Slowed Down Time Trialists",beats:["#Alex built his specialist career around one insight: speed wins time trials, not power. Most riders chase a big number on their power meter. He chased aerodynamic efficiency and smart pacing.","A young Marc Soler approached him after a 30 minute time trial Alex had won by over two minutes, on the same bike, same skin suit, same helmet. Soler weighed 70 kilos and averaged 400 watts. Alex weighed 78 and averaged 395.","^'After one kilometer, I was already 10 seconds ahead. I just rolled down the start ramp and sat down in the aero bars rather than sprinting on the base bar. I did 300 watts less than you for those first 30 seconds and was already ahead.'`","On a downhill section, Soler held 400 watts for 60 kilometers per hour. Alex sat on his top tube at zero watts and went 70. ^'You were doing 400 watts for 60k an hour. I was doing zero watts for 70. So I was going 10 kilometers per hour faster for 400 watts less.'`","On the climb after, Alex sprinted at 500 watts from a higher starting speed with fresher legs, crested the top faster, and needed less acceleration afterward. The gap from that one section alone: 40 to 50 seconds. His average power for the section was lower than Soler's.","^'An awful lot of people, the power meter has slowed down their time trials. Everyone wants a big number to report back at the bus or the village hall. Speed is what wins time trials, not watts.'`","He now spends significant time at the Silverstone wind tunnel doing aerodynamic consultancy. He and Michael Hutchinson play a guessing game behind the glass: faster or slower? He estimates he's right about 70% of the time. ^'You spend enough time there, you start to see aero.'`"]},{title:"Arriving at the Start Line with Nothing Left",beats:["#Late in his career, a phrase he'd always dismissed took on new meaning: doing your best. ^'As long as you do your best, that's all that matters. I always thought that was a real cop out of an expression.'`","Then it shifted. He stopped caring about the 20 minutes between start and finish. He started caring about everything before. ^'I wanted to arrive at the start line feeling there was nothing more to give. And when whatever happened at the finish line, that was the result.'`","If he lost by a second, he was at peace. No excuses about a different tire or a different skin suit. ^'I realized I didn't want excuses anymore.'`","His final year proved it. A time trial at Tirreno where his power meter read numbers he thought were broken. He asked the team to send him off early so he could go back and watch Netflix. They told him he was in the hot seat. The final result: Ganna first, Remco second, Pogacar third, Asgreen fourth, Dowsett fifth. 465 watts average. ^'That's as good as it gets. And it's still only fifth.'`","The ghost writer for his book, Bloody Minded, asked him why he always felt lazy despite never missing training, never partying, never being overweight through lack of effort. Alex couldn't explain it. ^'I always just felt like however much I was doing, someone was going to be spending five or ten minutes more on the bike than I was.'` The book helped him realize he'd been harder on himself than the evidence justified."]},{title:"Helping Cavendish Go Faster, Then Getting Hired",beats:["#While still racing, Alex noticed he got a genuine kick out of helping other people go faster. At the 2019 Tour de France, his Katusha team was woefully unprepared for the team time trial. He looked around at his teammates on their TT bikes. ^'They looked terrible. Truly awful.'`","He quietly adjusted their handlebar positions. They went out the next day stunned. ^'This is amazing. I can do four or five hundred watts now in position and it's not killing me.'` The team finished top five.","At Israel Premier Tech, they didn't have a bike fitter for time trial bikes. So Alex did it himself, fitting 12 to 14 riders on training camp. ^'It hadn't been heard of for a rider to do the bike fitting, but no one else was going to do it.'`","After retiring, he got a call about helping Mark Cavendish prepare for his 35th Tour de France stage win. He spent 12 weeks before the Tour looking at tire aerodynamics, then went down a rabbit hole into broader aero work with Cavendish. ^'We actually didn't look at tires at all in the end.'`","The team, XDS Astana, hired him as performance engineer off the back of that work. It's now his second year. ^'Part of what we've created in Stride was born from me going, I have all of this data from these riders, but analyzing it isn't what I want to see.'`"]},{title:"The Gap Between Free Plans and Coaching",beats:["#The insight that became Stride started simply: ^'I realized that information I have and take for granted, that I know intrinsically, is groundbreaking to other people.'`","He set up Tides Club Coaching with James Millard. It ticked along, coached people, never got too big. But he saw the ceiling. ^'There's a capacity to coaching. And a lot of people are priced out of it.'`","The gap was clear. Between a free training plan from a book or the internet that gets followed for a couple of days and then abandoned, and a human coach at 100 pounds a month or more, there was a massive unserved population.","Then Alex Barlow approached him and James about two years before launch. Barlow was unhappy with the existing tools for training analysis. Dowsett and Millard had used the same tools for a decade without questioning them. Barlow said: ^'I think we can do this, this, this, and this.'` They said: we're in.","Barlow is the technical mind. ^'The guy is mind blowingly good.'` Dowsett brings the domain knowledge, the years of racing data, the understanding of what a rider actually needs to see. Millard brings coaching methodology.","One of the core questions from day one: ^'How do we give professional level coaching for 12 quid a month?'`"]},{title:"A Coach That Already Knows Your History",beats:["#Stride is not a training plan generator. It's closer to a coach that already knows you. ^'In Stride, your plan is based on what you already do. It knows your routine. It sees your rhythm. It knows which rest days you take. You don't have to input any of this.'`","If you get sick in week two, Stride recognizes it from your data. Weeks three and four adjust automatically. A ChatGPT plan can't do that. ^'With ChatGPT, you'd have to start over. We are far closer to a coach than a one off generated plan.'`","Stride also builds the actual workout sessions. Not just a text description, but files your Garmin or Zwift can read. ^'When you jump on the turbo trainer or on the road, your device pops up: this is what we're doing today. A ChatGPT plan doesn't create your workout files with your specific intervals. That's on you.'`","Alex uses his wife Chanel as a reference point for the non data obsessed user. She did an Ironman. She didn't care about heart rate variability or whether her fitness was trending up or down. She just wanted to do the training her coach set and be told: you're improving. ^'If we can show Chanel in simple terms that she's getting better, that's the real win.'`","The team time trial analysis tool was built because Alex needed it at Astana. He needed to see all riders' data overlaid simultaneously, not one by one. Barlow built it. That tool now lives inside Stride for any team or group ride to use.","A specific example from the Dauphine: one rider attacked hard at the bottom of a climb, gained five seconds, but depleted his anaerobic capacity aggressively. The rider who eased in came out ahead. ^'I can demonstrate this to riders so clearly now. You lost this amount of time because you did this.'`","They also built wind analysis into the platform. At the UAE Tour, later starters were subjected to about seven kilometers per hour more wind than early starters. ^'Being able to see directly the impact of that, and then analyzing what might have been.'`","They refuse to release features prematurely. ^'AI is everywhere at the moment, and there's so much poor AI out there. We will not release it until it's really, really bloody good.'`"]},{title:"Preparing to Stop Before You Have To",beats:["#His manager Sky Andrew told him early: ^'You have to be working on life after sport now, because if you do it in the last couple of years, you won't, and you'll fail.'` Andrew gave him two examples: David Beckham, who built a brand alongside his career, and Steve Redgrave, the most decorated British Olympian of his era, who focused purely on sport and never became the household name he should have been.","Alex and Chanel spotted a gap: no professional cyclist was doing YouTube properly. They started filming during his career. It didn't intrude on racing. ^'We realized the value in my story. We realized the value in telling a story. And then we realized there was a massive space within pro cycling for YouTube. No one was doing it.'`","When his 2020 Giro win happened, the reception on social media was enormous. Other riders at his level won stages too, but the emotional investment from Alex's audience was on a different scale. ^'People are more emotionally invested in you because they feel like they know you. Unless you're not true to yourself on social media, they do know you.'`","The hour record attempt, organized almost entirely by Chanel as project manager while he trained, was filmed and published. The Little Bleeders charity logo was on his jersey. It was unsuccessful, but he and Chanel view it as a success because of what it did for the charity and their audience.","When he finally retired at the end of 2022, social media income replaced his racing salary within the first year. YouTube and Instagram sponsorships, brand ambassadorships with NoPins and Wattbike, aero consultancy at Silverstone. ^'It wasn't easy. It's volatile. But it fell straight into place.'`","He also took on a role as head of development at Anexo, a junior team, helping young riders avoid the mistakes he made. And he was the wind tunnel test mule for the NoPins Hypersonic skin suit, testing it to be fastest rather than just marketing it as such. ^'We know that data is sound, but I know there's people out there who won't trust it. Independent testers are now feeding back: it's quick.'`"]},{title:"The Little Bleeders",beats:["#Alex founded Little Bleeders to support young hemophiliacs and their families in the UK. It uses his story and the stories of other hemophiliacs to show what's possible with the condition today.","The charity runs a Sports Fund. With the cost of living crisis, many families can't afford to get their children to swimming lessons, local bike races, or dance classes. ^'What's super important for hemophiliacs is being fit and healthy and active. The Sports Fund helps families get their little boys to the activities that keep them moving.'`","It's boys in 99% of cases because of how hemophilia is carried on the X chromosome. Alex's daughter Juliet is a carrier. If she has sons, there's a 50% chance they'll have hemophilia as severe as his.","He sees the charity as bigger than cycling. ^'When I was racing, I realized the work I did for Little Bleeders was always bigger than cycling. It was bigger than what I was doing on the bike.'`","His medication has evolved hugely in his lifetime. When he was young, treatment was reactive: bleed first, inject after. At 11, it became proactive: inject every second day to prevent bleeds. Now, gene therapy exists. One injection, done for life. ^'A hemophiliac born today is going to have a far better run of luck than I had. And I had a far better run of luck than someone born ten years before me.'`"]},{title:"We're All Going Through the Same Thing",beats:["#Years into his career, Alex entered a local 10 mile time trial near his home in Maldon, Essex. He finished in about 19 minutes. A woman finished the same course in 29 minutes. Afterward, everyone went to the pub to talk about the race.","He asked her: how was your ride? She said: ^'That bit by the petrol station really kicked the crap out of me.'` He said: wasn't it? It was brutal. She looked confused. ^'I bet you barely even felt it.'`","He told her: ^'Oh no, I felt it. Trust me. It just happened at a slightly different speed.'`","That exchange became his philosophy. ^'It doesn't matter if you're Tadej Pogacar or just starting out. We're all going through exactly the same thing. Possibly at slightly different speeds, but we're all doing it.'`","A coaching client once messaged him saying he didn't think he was worthy of being coached by a former pro. Alex replied: ^'Zone three for me is exactly the same feeling as zone three for Ganna and for Pogacar. It's just at slightly different speeds and powers. But we're all doing exactly the same thing.'`","That belief, that the experience of effort is universal and only the speed changes, is the foundation Stride is built on. Professional level insight shouldn't be locked behind a price tag most people can't reach.","=This story was assembled by <b>Andres Vanryckeghem</b>, founder of <b>Athlete Founders</b>. He analyses athlete entrepreneurs every day to help other athletes see the possibilities of their own projects, and to make their first steps very concrete based on all these learnings."]},]},o=["Hemophilia","Finding the Bike","Getting Supported","Going Pro","The Giro 2013","The Giro 2020","The Craft","Mindset","Performance Engineering","Starting Stride","What Stride Does","Life After Pro Cycling","The Charity","The Lesson"],a=0,i=0,r="intro",s=[],d={},l=0;t.innerHTML='<style>@import url(\'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap\');*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:host{display:block;width:100%;--a:rgba(255,255,255,.05);--b:rgba(255,255,255,.1);--c:rgba(255,255,255,.3);--d:rgba(255,255,255,.025);--e:rgba(255,255,255,.08);--f:rgba(255,255,255,.25);--g:rgba(255,255,255,.07);--h:rgba(255,255,255,.5);--i:rgba(255,255,255,.75);--j:rgba(255,255,255,.45);--k:rgba(255,255,255,.04);--l:rgba(255,255,255,.12);--m:rgba(255,255,255,.09);--n:rgba(255,255,255,.4);--o:rgba(255,255,255,.15);--p:rgba(255,255,255,.7);--q:rgba(255,255,255,.2);--A:rgba(0,200,150,.6);--B:rgba(0,200,150,.3);--C:rgba(0,200,150,.4);--D:rgba(0,200,150,.5);--E:rgba(0,200,150,.12);--F:rgba(0,200,150,.06);--G:rgba(0,200,150,.7);--H:rgba(0,200,150,.2)}#shell{display:flex;width:100%;max-width:100%;height:100vh;overflow:hidden;font-family:\'Inter\',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0d1b1e;color:#f0ede8}\n\n@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@keyframes e
