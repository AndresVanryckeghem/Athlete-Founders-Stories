<script>
/* ---------- choice / read screen wiring + analytics ---------- */
(function(){
  var choice  = document.getElementById('fsw-choice');
  var mount   = document.getElementById('fsw-mount');

  // ---- analytics state ----
  var modeEnterTime = null;     // when current mode (read) started
  var currentMode = 'landing';  // 'landing' | 'read'

  function secondsSince(ts){ return ts ? Math.round((Date.now() - ts)/1000) : 0; }

  function leaveMode(){
    if(currentMode === 'read' && modeEnterTime){
      var rs = secondsSince(modeEnterTime);
      if(rs > 0 && rs < 3600){ // sanity cap: ignore stale/garbage timers over 1hr
        window.track && window.track('read_session_end', { seconds_in_read: rs });
      }
    }
    modeEnterTime = null; // always clear after leaving, prevents double-fire/double-count
  }
  function enterMode(name){
    leaveMode();
    currentMode = name;
    modeEnterTime = (name === 'landing') ? null : Date.now();
  }
  window.addEventListener('pagehide', leaveMode);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      leaveMode();
    } else if(document.visibilityState === 'visible' && currentMode && currentMode !== 'landing' && !modeEnterTime){
      modeEnterTime = Date.now();
    }
  });

  function showRead(){
    choice.classList.add('hidden');
    mount.style.display = 'block';
    if(window.__fswStart){ window.__fswStart(); }
    enterMode('read');
    window.track && window.track('choice_made', { mode: 'read' });
  }

  document.getElementById('pick-read').addEventListener('click', showRead);

  // first event: page open
  window.track && window.track('story_opened');
})();
</script>

<script>
!function(){if(!window.__fswI){window.__fswI=!0;var e=document.getElementById("fsw-mount");if(e){var t=e.attachShadow({mode:"closed"}),n={title:"Kleta",tagline:"How a German who wanted to be a footballer built a bike subscription startup in Barcelona, grew it to 2,500 riders, lost it all, and started again.",chapters:[{title:"The German Who Wanted to Be a Footballer",beats:["#Falk Siegel is German by birth, passport, and appearance. He wanted to be a professional footballer. He left Germany as a teenager with a scholarship to play in the United States. Then he tore his knee ligament. The dream ended.","He spent years in different countries. Colombia, where part of his family lives and where he met his wife. London, where he worked at a fintech for two and a half years and got hooked on startups. Then Spain, where he joined Badi, a flat sharing platform that was one of Barcelona's top startups at the time.","At Badi, he opened the Berlin market. The company had raised over 40 million dollars without monetizing. He saw explosive user growth, then COVID hit. The company started cutting staff. His co founder to be, Diego Casabe, was let go in the first wave of layoffs.","^'I remember a call on a Saturday in a park, hidden, because we couldn't go out. I had the idea for Kleta and I pitched it to Diego. He'd just been fired. He had the hunger to do something.'`"]},{title:"Thirty Tourist Bikes on Day One",beats:["#Two weeks before COVID locked Spain down, Falk had bought a whiteboard to sketch out the idea. Then lockdown hit. No money in the bank. No investors. First time founders. No way to raise capital in a pandemic.","The solution was simple. Every tourist bike rental shop in Barcelona was closed because there were no tourists. Falk and Diego called them all until they found the cheapest one willing to rent them 30 bikes. They sub rented those bikes to locals on a monthly subscription.","The first Kleta bike hit the street on the first day Spain allowed people outside again, in May 2020. ^'We were fast. Literally the first day they let us out, we launched.'`","The original plan was to target short term visitors: students, expats, people staying three to six months. They quickly realized the bigger problem was locals. People living in Barcelona who wanted to switch from cars and metro to bikes but faced real barriers: theft risk, high purchase cost, and uncertainty about whether cycling would stick as a daily habit.","^'More than 80 percent of our users switched to bikes thanks to Kleta. Our clients told us: you are changing my life. I am rediscovering my city in a completely different way.'`"]},{title:"The Yellow Front Tire",beats:["#From day one, they wanted the bike itself to be marketing. They debated options: a painted frame, a colored rear wheel, stickers. They settled on a yellow front tire. It was the easiest to implement operationally and the most visible on the street.","The branding was deliberately subtle. No aggressive logos on the frame. The bike was meant to feel like yours, not like a rental. You might keep it for a year, two years, three years. ^'We wanted a bike that people would identify with, not feel like they were riding an advertisement.'`","The yellow tire became so recognizable that it generated organic growth. More than 50 percent of new users came from recommendations by existing users. They never paid for traditional advertising that worked. ^'Working with Meta and YouTube is very expensive. Our growth came from people seeing the yellow tire on the street and asking: what is that?'`"]},{title:"Ter Stegen and Gasol",beats:["#Marc Andre ter Stegen, the FC Barcelona goalkeeper, was the first famous investor. It took six to seven months of conversations before he committed. It was his first startup investment. The connection was the mission: making Barcelona more sustainable, less noisy, more enjoyable for commuting.","Marc Gasol, the former NBA player, invested six months later in the seed round. The round also included Fondo Bolsa Social, an impact fund from Madrid, and Sabadell Bank. Total raised with debt included: just over two million euros.","The famous names helped enormously with press. When they announced the seed round, Marc Gasol got more media coverage than the institutional lead investor. ^'The note of press came out and Marc Gasol was mentioned far more than the Fondo Bolsa Social, because those are the news that travel.'`","Beyond press, the athlete investors added credibility with consumers and providers. ^'When people look up to athletes and the athlete says try this, that push is something we needed. Because we knew: once they use it, they don't want to change.'`"]},{title:"Surfing the Wave Without Realizing It",beats:["#The first big round closed at the end of 2021. In 2022, they grew nearly 4X. They opened Valencia and Seville. They had over 2,500 active subscriptions, 60 percent on electric bikes. They had 30 employees.","Looking back, Falk sees it clearly. ^'We were surfing the wave without realizing we were surfing the wave. The market was very liquid. The demand after COVID was enormous. Cities were building new bike lanes. It was a boom that lasted two to two and a half years.'`","Their ambition matched the moment. They wanted to go to Paris, to London. The investors wanted growth. But the model was capital intensive. Every new subscriber required a physical bike. And unlike software, margins were tight and you had to open city by city.","^'When you understand that your business needs volume but the margins are tight and you don't have the scalability of software, you have to internalize a lot of the value chain to make enough money. And that is not easy.'`","They took on over one million euros in debt to finance bike purchases. The logic made sense: don't use expensive equity to buy bikes, use debt. But they took too much debt too early, before they were profitable. ^'Once you have that debt and you're not on the business plan trajectory anymore, the debt is still on your balance sheet. It conditioned everything that came after.'`"]},{title:"The Market Closed and the Debt Stayed",beats:["#By 2023, the venture capital market had shifted. Interest rates were rising. Investors who had been eager for growth now wanted profitability. Kleta's model, capital intensive, not yet profitable, became uninvestable in the new climate.","^'When we went to raise more money, the answer was: you are not going to raise four, five, ten million with this business model in these changed times.'`","They pivoted. First, they started selling bikes outright to generate immediate cash flow. Then a more drastic decision: stop growing the consumer business entirely. Make it profitable as is. Pivot hard into B2B, selling bike subscriptions to companies for their employees. They were already working with over 50 companies including Mercadona.","The B2B opportunity was real. Falk could see it. But the debt from the growth phase was choking them. ^'There was a light at the end of the tunnel. I didn't see it as far away. But the moment I understood that our financial situation didn't allow us to run fast enough to reach it, I started seeing things differently. And that happened almost from one day to the next.'`"]},{title:"The Flame Went Out",beats:["#There was a specific day when everything changed. Falk won't share the details of what happened. But he sat alone in a cafe afterward and felt the flame that had burned inside him for five years simply go out. ^'I felt it literally. That flame went out and it never came back on.'`","He tried to convince himself rationally that there were still paths forward. Restructure the debt. Find a buyer. Keep pivoting. But emotionally, he already knew.","The question became: how do you reduce the damage for everyone involved? Clients who depended on the service. Employees who had families. Investors, including over 40 small shareholders who had believed in the vision.","^'Difficult decisions in the short term make your life easier in the long term. When you start avoiding difficult decisions, the long term consequences are brutal.'`"]},{title:"Forty Phone Calls on the Worst Weekend",beats:["#The weekend Falk sent the email to all shareholders was one of the saddest days of his life. He came home and lay on the sofa, unable to move. ^'I'm normally super active. That day I didn't want to do anything.'`","Then he sat down and called every single investor, one by one. Over 40 calls. The first few were the hardest because he didn't know how people would react.","Marc Gasol's reaction surprised him. ^'He said: you tried, you gave everything, you fought like lions, you pivoted. This happens. It's a stage that many entrepreneurs go through.'` That empathy from the investors gave Falk energy to keep going through the rest of the calls.","The crowd investors, the non professional ones, were harder. ^'In the last fundraising round, we took investment from the crowd. I would never do that again. The responsibility when they are not professional investors is very particular.'`"]},{title:"Selling the Living Company, Not the Parts",beats:["#The critical distinction Falk makes: this was not a liquidation. It was the sale of a productive unit. In a liquidation, you sell the assets piece by piece. The brand dies. The clients lose the service. The employees lose their jobs.","In a productive unit sale, the buyer takes the whole business: the clients, the employees with their full employment history, the brand, the operations. Cooltra, one of Europe's main mobility players, committed to running the same business model for at least three years.","Falk and Diego had planned this carefully. Before filing for the formal insolvency process, they already had Cooltra's binding offer. They knew all the potential buyers, had relationships with them, had a clear timeline. ^'If we had waited longer, the productive unit sale would never have happened. We took the decision at the right time.'`","Throughout the process, the client never noticed. The service never degraded. Every employee was transferred. ^'We made sure the client experience stayed the same until the last day. That's what we're most proud of.'`"]},{title:"Moving to the Countryside with a Newborn",beats:["#Falk's daughter was born just before the final decision. He says it was a gift from the universe. ^'My daughter gave me so much strength and she didn't know it. She relativized everything. The professional situation was what it was, but my daughter was healthy, growing, and there was a family.'`","In the same month the sale was formalized, the family moved from Barcelona to the countryside outside the city. Less city, more nature, more time together. His stress levels dropped dramatically.","The habits that kept him functional during the hardest months: sleeping well, exercising daily, eating properly. ^'For me, that is the recipe. It's not complicated, it doesn't cost much, and it's this: sleep, sport, food. And then your environment and your family.'`","He also had a business coach who helped him see his own patterns. ^'I learned so much about myself. Patterns of behavior, why I was making certain decisions. It was one of the best investments I ever made, and nobody told me to do it.'`"]},{title:"Inviting Every Investor Into the Next Company",beats:["#Falk knew immediately he would start again. He had five years of experience, most of it earned in the hardest possible way. He wasn't going to give that to another company. He would capitalize on it himself.","He made a decision that defined who he wanted to be: every small investor from Kleta was invited into his new company, Velora Mobility, at a symbolic price. They didn't have to invest again. ^'They trusted my vision and it didn't work out. I'm not going to leave them behind. I want them to be part of the next adventure.'`","Velora manages bike fleets for large enclosed spaces: resorts, campings, industrial sites, university campuses
