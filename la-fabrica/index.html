<script>
/* ---------- choice / read screen wiring + analytics ---------- */
(function(){
  var choice  = document.getElementById('fsw-choice');
  var mount   = document.getElementById('fsw-mount');

  // ---- analytics state ----
  var modeEnterTime = null;     // when current mode (read) started
  var currentMode = 'landing';  // 'landing' | 'read'

  function secondsSince(ts){ return ts ? Math.round((Date.now() - ts)/1000) : 0; }

  function leaveMode(){
    if(currentMode === 'read' && modeEnterTime){
      var rs = secondsSince(modeEnterTime);
      if(rs > 0 && rs < 3600){ // sanity cap: ignore stale/garbage timers over 1hr
        window.track && window.track('read_session_end', { seconds_in_read: rs });
      }
    }
    modeEnterTime = null; // always clear after leaving, prevents double-fire/double-count
  }
  function enterMode(name){
    leaveMode();
    currentMode = name;
    modeEnterTime = (name === 'landing') ? null : Date.now();
  }
  window.addEventListener('pagehide', leaveMode);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      leaveMode();
    } else if(document.visibilityState === 'visible' && currentMode && currentMode !== 'landing' && !modeEnterTime){
      modeEnterTime = Date.now();
    }
  });

  function showRead(){
    choice.classList.add('hidden');
    mount.style.display = 'block';
    if(window.__fswStart){ window.__fswStart(); }
    enterMode('read');
    window.track && window.track('choice_made', { mode: 'read' });
  }

  document.getElementById('pick-read').addEventListener('click', showRead);

  // first event: page open
  window.track && window.track('story_opened');
})();
</script>

<script>
!function(){if(!window.__fswI){window.__fswI=!0;var e=document.getElementById("fsw-mount");if(e){var t=e.attachShadow({mode:"closed"}),n={title:"La Fabrica",tagline:"How a Tour de France cyclist and the barista he met at 21 built a cafe, a roastery, and four businesses in a sleepy Spanish town.",chapters:[{title:"The Cyclist and the Barista",beats:["#Christian Meier grew up in Canada with German parents who had immigrated in the 1970s, giving him dual citizenship and a German passport. From a young age, his dream was to become a professional cyclist, to race on the European WorldTour, to ride the biggest races in the world.","When he was 21, he walked into a coffee shop in Vancouver. Amber was 16 years old and working behind the counter. She made him coffee. He came back the next day and the day after that, finding out her schedule in what she calls a non creepy way.","They got engaged when she was 18. They moved to Europe together. They got married when she was 20. ^'We were just babies,'` Amber says.","The whole time, Christian was riding every day, training with one goal: to get a professional contract in Europe."]},{title:"The Sleepiest Little Town",beats:["#In 2008, Christian signed his first real professional contract with Garmin Slipstream, an American team that had chosen ^Girona, Spain` as its base. All the non European riders on the team were encouraged to live there so the team could organize logistics, flights, and training from one place.","When they arrived, Girona was a sleepy little town. There were about ^10 to 12 professional cyclists` living there and not much else. ^'Literally nothing was happening,'` Christian says. ^'Just randomly some bike riders.'`","Nobody spoke English. The locals spoke Catalan, not even standard Spanish. There was no specialty coffee, no international food scene, almost no tourism.","But every time they traveled for races or holidays and came back, Girona kept checking every single box. Weather, mountains, coastline, a high speed train to Barcelona in 38 minutes, affordable rent, and the best training roads in Europe. ^'Every time we came back, there was nothing we felt that we were missing.'`"]},{title:"The Tour and the Question After",beats:["#Christian raced for years at the highest level. He was away constantly, racing up to just over ^100 days a year`, plus training camps and travel. Add it all up and he was gone ^160 to 180 days a year`.","Amber was in Girona, supporting him, but increasingly searching for something of her own.","He made it to the Tour de France, the pinnacle for any professional cyclist. But he was realistic about who he was. ^'I understood for me to do the Tour de France was going to be the pinnacle of my career.'`","Once he achieved that, a question started forming. ^'I just thought, okay, how much longer can I do this? As much as I love being full time domestic household engineer, I feel there has to be a little bit more.'`","They considered having Amber go back to Vancouver while Christian kept racing. But then a simpler idea surfaced. The only thing Girona was missing was a specialty coffee shop. ^'If we just put that little 1% in, Girona would be perfect.'`"]},{title:"Down the Alleyway",beats:["#They met with a local real estate agent. They explained what they wanted: something small, because they didn't have a ton of money. Always start small, they figured. If it grows, great.","The agent had one place he didn't recommend. He showed them photos online and said it wasn't really a good option. They loved the photos and said, let's go look anyway.","He walked them down a narrow alleyway, far off the main street. It opened up into a little plaza with century old stone steps leading up toward the cathedral. The sun was hitting the door.","Inside was a ^100 year old carpenter's workshop`. There were wood shavings on the floor. You could still smell the cedar. The light hit the exposed stone walls and the original floors. ^'We just saw it and we were like, holy guacamole, this is the spot.'`","Within 30 minutes, they were ping ponging ideas. The bar goes here, the coffee machine over there, seating along the wall.","The agent kept telling them: ^'No, no, you're way too far. No one's going to come down here. You need to go that way on the main road.'`","They refused. They wanted to be a place people had to seek out. ^'When they come down this alleyway and it opens up to this plaza, it's like they've reached the X on a treasure map.'`"]},{title:"Tape Over the Door",beats:["#Starting a first business is incredibly difficult. Starting one as foreigners in a Catalan speaking city, even harder. They had a local guy helping them with licensing and city hall paperwork.","They opened the door. Within about three months, they got shut down. ^'But like, properly shut down,'` Christian says. ^'The police came. Tape over the door. Everybody out. It kind of felt like it was a crime scene.'`","There were licensing issues they hadn't fully understood. They had to reapply for everything. New construction. Soundproofing.","They even had to hire an archaeologist to verify how old the building was, because it was a protected structure. ^'Like Indiana Jones,'` Amber says.","The first year was brutal: opening, closing, feeling like they'd started over, then opening again. But the reopening actually turned out better. They were granted a higher license that let them prepare food, stay open later, and do more.","The mayor of Girona at the time was pro cycling and supportive of young people trying to do something different. ^'I think he kind of helped a few things move along in the beginning. We were very grateful for that.'`"]},{title:"The Cycle Cafe That Isn't Just for Cyclists",beats:["#La Fabrica means the factory in Spanish. They joke that it makes sense: they're the coffee factory. The name just appeared. Neither of them can remember who came up with it.","With Christian being a professional cyclist, cycling was naturally part of the story. They added a water bottle filling station, free bike locks for riders parking outside, and a menu designed around nutritional fueling.","But they were deliberate about not making it a cycling only space. ^'Our intention was never really to make a cycling cafe or a cafe for cyclists. It was really about expressing ourselves and who we were, and cycling was a part of that.'`","An espresso and a croissant has to come in under ^five euros`. But if you want the luxurious fruit plate with gold dust and edible flowers, that's there too. ^'We just wanted to have a little something for everyone.'`"]},{title:"Walking Away From a Contract",beats:["#After a couple of years running La Fabrica while still racing, Christian reached a decision. He was ^31 years old`, still under contract with Orica GreenEDGE. He asked to leave a year early.","He could have stayed on cruise control for another six to eight years, collecting a good salary. ^'Tour of Catalonia, Pays Vasco, Ardennes. It's good, it's cool, but you do the same races every year. I've already done them 10 times. I don't need to do them another 10 times.'`","The business side was pulling him forward. ^'You've got this other part of your life that's exciting and happening and you're learning a lot.'`","The decision was straightforward. ^'I can leave that and do this, and get back to growing as a person.'`"]},{title:"Three Businesses in Two Years",beats:["#La Fabrica opened in ^2015`. The second business, ^Espresso Mafia`, opened in ^2016`. It's a high end espresso bar where Christian roasts all the coffee himself, the only in town roaster in Girona.","They got the roaster permitted when nobody cared. ^'Our engineer says there is no way they would let that happen now.'`","The third business, also in 2016, was ^The Service Course`, a high end cycling shop. Christian knew from years in the peloton that Girona was missing a luxury bike experience.","Later came a fourth: ^Overland Running Provisions`, a trail running shop. All four businesses sit within a two to five minute walk of each other.","Amber's assessment of that period: ^'We were just absolutely grinding.'` Both of them get restless when things get too calm. ^'Classic entrepreneurial energy. It gets a bit too calm, and you're like, well, maybe we should do something else.'`"]},{title:"The Yin and the Yang",beats:["#Early on, they learned to respect each person's domain. Christian handles coffee: sourcing, roasting, quality. Amber handles the cafes: hospitality, day to day operations, hiring, social media for all four businesses.","^'The things that I'm really good at, he's not so good at. And the things that he's really good at, I'm very bad at,'` Amber says.","The overlap is small, which makes decisions cleaner. ^'What you say goes in that department. Obviously, we still discuss a lot of things, but she's got the final say, no matter what.'`","It also comes from growing together since she was 16 and he was 21. ^'Being together so long, it's like I've learned what I have to be really good at, because if I'm not good at it, it's not going to get done.'`"]},{title:"Five Minutes of Talking",beats:["#Across all four businesses, they now employ ^25 people`. Amber does the hiring. She doesn't bother with resumes. ^'Let's just sit down for five minutes. I just want to hear you talk for five minutes.'`","She can tell immediately who's just looking for a job versus who's looking for a job with them specifically.","The team comes from all over the world: Turkey, Ukraine, Uruguay, Colombia, Argentina. All hired on the same principle. ^'Attitude for gratitude,'` Amber calls it.","^'When people come in and they work for you, that is a huge honor. I take that responsibility very seriously. If they're happy, I'll be happy. If they're happy, my customers will be happy.'`","The logic is simple: if your staff is unhappy, underpaid, overworked, or burnt out, you cannot execute a vision of good vibes and warm ambiance. ^'It seems so simple, but it's really, really important.'`"]},{title:"Why Not Fifty La Fabricas",beats:["#People approach them constantly with ideas. Open a La Fabrica in Australia. In New Zealand. In Boulder, Colorado. Franchise it. Scale it.","Every time, Amber sits herself down and runs through the same set of questions. Is it for the money? No. ^'We lived in a trailer when we first met. We've lived off of pennies. With a tiny amount of money, we have more than we could ever need.'`","Would it cost time? Yes. Would it be ego? She checks that too. ^'Everything I have, I have with just one. Is anything going to get better if I have 10? Is anything going to get better if I have 50?'`","^'I don't think I'll be able to ever create another location more special than the one that I have. So instead of trying to build more, why not just really take care of what you have?'`","They've never paid for a single advertisement. No paid influencers, no sponsored posts. All growth has come from word of mouth. ^'I know in my heart that all the little growth that we've had have been from honest, genuine reviews. Money can't buy that.'`"]},{title:"From Pedals to Trails",beats:["#After leaving the bike shop in a difficult exit, Christian fell out of love with cycling. The bike had become tied to an identity that now carried negative emotions. Then COVID hit and locked Girona down. The only place to go was the trails behind the city.","He started running. He was hooked immediately. But he was also terrible. ^'I was so bad at running.'` He had the engine of a cyclist but the chassis of a beginner. He could power uphill with anyone, but on flat ground runners dropped him.","Classic mistake: he ran way too much too soon. ^'You have this capacity to do a lot of work, but your body is not ready.'`","^'When I first started running, did I really think that I would go to the point where I was thinking about becoming a professional athlete again? Probably not. But just kind of following your heart and following the evolution of wow, I'm really getting into this.'`","He opened ^Overland Running Provisions` partly out of a selfish need for community. ^'I kind of realized what I was really missing was this just human connection and interaction with people.'` He started a running club. The running club became the running store."]},{title:"Winning in Chamonix",beats:["#In August 2023, Christian entered the ^TDS`, one of the premier races during UTMB week in Chamonix. He coached himself. He was not paid to race.","The race started at midnight. There were snowstorms, passes with no visible trail, just snow and darkness. It worked in his favor. He was more worried about the heat.","Everything went perfectly. He stayed in his zone the whole way. Coming into ^Les Houches`, the last aid station about eight kilometers from the finish, the gap was large enough that he could have almost walked and still won.","But what hit him was the people. ^'There were so many people, friends and supporters who came out to that station just because I was leading. That was such an emotional feeling.'`","Running down Main Street in Chamonix, there were no barricades yet. Random people started clapping as they realized a TDS runner was coming through. Then the road opened to the barricaded finish, a thousand people, the big arch.","^'I just thought, take your time and just absorb what is happening. There's only been 10 winners of this race.'`","He considers it the biggest achievement of his sporting life, bigger than the Tour de France. ^'Where running was different for me was, it was purely for myself. I wasn't getting paid to run. I coach myself. It felt like this culmination of everything I worked for and sacrificed for. It kind of felt like I did it myself.'`","=This story was assembled by <b>Andres Vanryckeghem</b>, founder of <b>Athlete Founders</b>. He analyses athlete entrepreneurs every day to help other athletes see the possibilities of their own projects, and to make their first steps very concrete bas
