<script>
/* ---------- choice / read screen wiring + analytics ---------- */
(function(){
  var choice  = document.getElementById('fsw-choice');
  var mount   = document.getElementById('fsw-mount');

  // ---- analytics state ----
  var modeEnterTime = null;     // when current mode (read) started
  var currentMode = 'landing';  // 'landing' | 'read'

  function secondsSince(ts){ return ts ? Math.round((Date.now() - ts)/1000) : 0; }

  function leaveMode(){
    if(currentMode === 'read' && modeEnterTime){
      var rs = secondsSince(modeEnterTime);
      if(rs > 0 && rs < 3600){ // sanity cap: ignore stale/garbage timers over 1hr
        window.track && window.track('read_session_end', { seconds_in_read: rs });
      }
    }
    modeEnterTime = null; // always clear after leaving, prevents double-fire/double-count
  }
  function enterMode(name){
    leaveMode();
    currentMode = name;
    modeEnterTime = (name === 'landing') ? null : Date.now();
  }
  window.addEventListener('pagehide', leaveMode);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      leaveMode();
    } else if(document.visibilityState === 'visible' && currentMode && currentMode !== 'landing' && !modeEnterTime){
      modeEnterTime = Date.now();
    }
  });

  function showRead(){
    choice.classList.add('hidden');
    mount.style.display = 'block';
    if(window.__fswStart){ window.__fswStart(); }
    enterMode('read');
    window.track && window.track('choice_made', { mode: 'read' });
  }

  document.getElementById('pick-read').addEventListener('click', showRead);

  // first event: page open
  window.track && window.track('story_opened');
})();
</script>

<script>
!function(){if(!window.__fswI){window.__fswI=!0;var e=document.getElementById("fsw-mount");if(e){var t=e.attachShadow({mode:"closed"}),n={title:"Zwift",tagline:"How a former junior racer who missed Central Park built the virtual world that redefined indoor cycling for millions.",chapters:[{title:"The Kid Who Couldn't Recover",beats:["#Eric Min was born in Seoul, South Korea. His family of five, three boys, left in the 1970s on a Pan Am 747 to avoid four years of mandatory military service. They settled in New Jersey, then the Bronx. He grew up a New Yorker.","His first bike was a beautiful orange bike with a banana seat and long handlebars. He was about eight years old. He didn't touch a bike again until high school.","At 14, a classmate named Travis Moomin got into touring through the American Youth Hostel. Before a driver's license, a bike was freedom. Eric insisted on buying the exact same 56 centimeter frame as his taller friend. He rides a 49 today.","He joined the Sleepy Hollow Bicycle Club in North Tarrytown, New York. Three identical triplet brothers named Whalen ran the club. They worked at a bike shop. Eric worked there too. They taught him everything about training, took him to races, introduced him to European racing through month old magazines shipped from overseas.","He traveled the country racing as a junior. On a given weekend in the Northeast, you could go to three or four different races in Pennsylvania, New York, New Jersey, Connecticut. This was the Greg LeMond era. You'd show up at a junior race and there could be a hundred riders.","Then he went to the Olympic Training Center to get tested. ^'I just didn't have the natural talent that allowed me to recover day after day. I'd be good for one day, but then the second, third day, my performance would decline, whereas my peers could just carry on.'`","He calls it the best thing that happened to him. ^'I'm glad I found that early on, because I think I could have just lied to myself about what I could be and just carried on for longer.'`"]},{title:"Wall Street, Then Walking Away",beats:["#His girlfriend, now wife, got him on track. She was an intern at JP Morgan and told him to apply. He didn't have the grades or credentials, but someone at JP Morgan liked him. ^'Oftentimes that helps you get across the line.'`","He got in on the technology side and spent eight years building commodities trading systems. He quit cycling entirely to focus. ^'I was never very good at doing many things at the same time. I have to stay focused on one thing and just give everything to that one thing.'`","After eight years, he asked himself one question: do I want to be my boss? ^'It was very evident to me that I didn't want to be him. I didn't want to have his responsibility.'`","He was 28. No children. No mortgage. ^'If I'm ever going to do something entrepreneurial, it's now. It's not 10 years from now.'` His fallback plan was simple: if it doesn't work, apologize to friends and family and go work for another big company."]},{title:"The First Startup That Paid for the Second",beats:["#Eric and his partner Alaric Marin left JP Morgan and started Sakonnet Technology in 1998. They built cloud based trading systems for oil and gas traders before the word cloud existed. They called it Application Hosting Services.","They raised about $600,000 from friends and family on a 50 page business plan nobody fully understood. ^'My brother invested $100,000 very early on. He didn't understand what we were doing. He thought, I'll never see that money again.'`","They started right before the internet bubble burst. The whole market collapsed. But they survived because their product served a real, specific need: oil and gas traders needed systems that worked.","Their biggest client was a German energy company called EON. They ate off that one client for over a decade. ^'The scariest thing. If you lose that one client, the business is dead. The whole cost structure depended on that one client.'`","The business took Eric to London. He stayed for 18 years. Sakonnet turned a profit, returned money to investors, and gave Eric the credibility he'd later need for Zwift.","On the side, they sponsored a small U23 cycling team called Sakonnet. Matt Caccere was the directeur sportif. They produced three or four professional riders, including Phil Gaimon and Caleb Fairly. ^'It's a small budget team, but we were so passionate about that team.'`","They exited Sakonnet in March 2014. Eric started Zwift in January 2014. The two overlapped by three months. ^'I never actually took a break.'`"]},{title:"Missing Central Park",beats:["#In New York, Eric had lived on the Upper West Side, two blocks from Central Park. A 10 kilometer circuit he could reach in two minutes. Training, competition, community, Tuesday night sprints at SUNY Purchase, Thursday intervals, organized 50 mile rides on weekends. Everything happened within that bubble.","When he moved to London, he lost every piece of that. Richmond Park was 30 minutes away. Regent's Park was too small. The weather was bad. Traffic was terrible. Air quality was worse back then. ^'I resorted to indoor riding.'`","He bought every indoor cycling product on the market. Not because he wanted to start a business. Because he needed something to keep him engaged. CompuTrainer had a 3D simulator that never delivered. Most products were solo experiences with bad graphics.","Then he found a product called Tour de Giro, built by two former IBM consultants from Canada. The graphics were terrible. The UI was terrible. But he raced in it with about 10 other people. ^'At the end of that race, I felt like I was there with these competitors. And I was like, this could work.'`","That feeling, being with other people while riding indoors, was the entire spark. ^'If we could just make the whole experience better, the graphics better, everything that goes with the training better, I thought there was something there.'`","It took him a while to understand what had actually motivated him all those years in New York. ^'It wasn't just about staying fit. It was the sense of being part of a community, competing, training, doing things together with other people. That was highly motivating for me.'`"]},{title:"The Last Thing He Wanted to Do",beats:["#After exiting Sakonnet, Eric knew two things: he was not employable, and his wife would not let him stay home doing nothing. ^'I've been on my own for so long, I'd probably have to start another company.'`","He had a checklist for the next business: internet enabled, global, delivered as a service, subscription model. And it had to be a consumer business, not B2B, because he never wanted to depend on one client again. ^'I wanted to know that if we lost 5 or 10% of our customers, we weren't going to go bankrupt.'`","He explored education, healthcare, hospitality. He even looked at making it easier to rent bikes at hotels. The math never worked on any of them.","Cycling was the last industry he wanted to touch. ^'I probably should not invest in my passion, because you could easily justify it. I know a lot of people who own bike shops. It's a passion play. And actually, it's very bad business. I didn't want to fall into that trap.'`","His brother told him plainly: ^'What are you doing? You don't know anything about that space.'` Eric stopped. ^'What do I know? I know finance and I know cycling.'`","His partner Alaric, who is not a cyclist, was sold by a different argument. ^'If we can start a business where we're inspiring people to be active, to be fit, to be healthy, who wouldn't want to back a business like that?'` That mission framing, not the cycling itself, is what brought in the second co founder."]},{title:"The Guy Coding at 2 AM with a Newborn",beats:["#In February 2010, a video game programmer named Jon Mayfield discovered a 30 mile bike path 100 meters behind his new house in Southern California. By his third ride, he was hooked. He had lived in Austin during the entire Lance Armstrong era and never noticed cycling existed.","Months later, he was watching the Tour de France, stacking books on training with power, and was one of the first people on Strava. He haggled a bike shop down from $500 to $430 for his first bike, then later bought a Specialized Roubaix one size too big because it was on sale.","Then daylight savings hit. He had a newborn. His wife's patience was running out. He bought a Kurt Kinetic fluid trainer, pedaled for five minutes, and got off. ^'This is horrible.'`","Jon worked in the video game industry: PlayStation Portable games for Sony, Ratchet and Clank, PS3, Nintendo 64 titles going back to the late 1990s. So he did what a game developer does: he started building his own solution.","He bought electronics, glued wires to his bike, wrote firmware to read the wheel speed, converted it to watts, and displayed them on screen. All of this happened between 10 PM and 4 AM while on night duty with the baby. ^'Half the time the kid is either down in the crib or up in some sort of chair next to me while I'm coding at 2 AM and hopping on a bike that's going nowhere.'`","By December 2010, he had a 3D bicycle on a road with power data. By January 2011, a steering controller under the front tire. He built a music video mode where the video got fuzzy if you didn't hold the right power. He built a coin collecting cool down game in a forest. ^'It's weird how little it takes to get you motivated to pedal harder. I'd have four seconds left to get this last coin and I'm just hammering. It means nothing. But I want to get the thing.'`","In spring 2012, he posted what he'd built on the Slow Twitch triathlon forum. He called it JMX Trainer Coach 0.5, subtitled: how to make riding on a trainer suck less.","The response was more positive than he expected. People replied: ^'Shut up and take my money.'` One person wrote: ^'Now, if we could race each other online every Wednesday night, that would be really cool.'`","He got four or five emails from entrepreneurs wanting to partner. None of them felt right. ^'Nobody really serious, or I didn't like the tone, or it was kind of like you do all the work and then I'll... I just got a bad vibe.'`"]},{title:"Knocking on Jon's Door",beats:["#In November 2013, Eric Googled for indoor cycling games. Jon Mayfield's project was the first result. Eric saw bad graphics and a single user experience. But he also saw the beginnings of something.","^'Most importantly, I didn't think too much about the tech, but I wanted Jon.'` Other people had emailed Jon. Eric was the only one who actually showed up. ^'I flew from London to LA and knocked on his front door to meet him in person and get a demo and go for a ride.'`","Jon was nervous. He had dressed in cycling clothes to demo the software, heart rate strap on. When he hopped off the bike to point at the screen, his heart rate read 160, displayed live in real time. ^'They're playing it cool and I can't tell if they're looking at my heart rate and I'm trying to switch the screens over because it seems a little bit embarrassing.'`","They went for a bike ride together up Mount Baldy in Southern California. Then Eric and Scott flew home.","A week later, Eric called and said: let's form a company. Jon was skeptical. ^'When he told me he thought we could have 50,000 users paying for the product someday, I was like, eh, probably not.'`","Jon was a self described pessimist. He'd posted on Slow Twitch in 2012: ^'I'm just a dude with kids, full time job, normal training load, not much of a threat to a company with a bit of resources behind it.'` Ten years later, that statement has multiple levels of irony.","Eric offered a safety net: if the company shut down within 12 months, the contract guaranteed Jon's salary. Jon had a mortgage and a new kid. ^'Paycheck to paycheck is an exaggeration, but to quit a job I loved was highly risky.'`","Eric's assessment: ^'You're not going to find many like Jon who had the skill set to build an engine from scratch. He's a cyclist and a runner. And Jon's a really nice guy. I put a proposal in front of him which I thought he couldn't refuse.'` Within two weeks, Jon quit his job."]},{title:"Sticky Notes in an Airbnb",beats:["#The company was created in January 2014. Jon left his old job on a Friday at 6 PM and drove to an Airbnb where the other three co founders were waiting. His commute between two jobs was one hour.","That first evening, they got to know each other. Jon hadn't met Alaric in person before. ^'Everybody's super nice, everybody's smart. I was more and more convinced each moment that this is the right group of people to do this.'`","The next morning, sticky notes went up on the wall. Cycling gyms. Running. Whatever they could think of. The general idea was online cycling where you could race other people, but massively multiplayer: not 16 people, but thousands.","Then came a surprising question: is cycling even the right sport? Jon's first task the following week was to convert his prototype to running using a Garmin foot pod. He ran around his neighborhood holding a tablet in front of his face. ^'I sent videos to the other partners and gave them my impressions. I think cycling is where it's at. Plus, treadmills are huge. How many people have treadmills at home?'`","They all agreed: cycling first. They found office space in Long Beach, halfway between Jon in Orange County and Scott in Santa Monica. It was cheap. Scott had moved from London to California specifically for this."]},{title:"Nobody Leaves Call of Duty for a Cycling Game",beats:["#The premise was: this is a video game product, and California has tons of game developers. The reality was different. ^'You've got video game people working on Call of Duty or Grand Theft Auto or big name franchises. Are they really going to leave and come work on some cycling thing? The answer was definitely no. They were not. And they did not.'`","The pitch that eventually worked had two angles. First, quality of life: the game industry is notorious for crunch, with 16 hour days before every holiday release. Zwift wouldn't do that. Second, mission: ^'Maybe you're working on Call of Duty blowing people up with grenades. Or you could feel better about working on a fitness product that makes people healthier and isn't violent.'`","By March 2014, they had a team of about eight. Eric and Alaric had funded the seed themselves, roughly a million dollars each. The plan: build an MVP in six months, then raise capital.","Eric's hiring philosophy evolved as the company grew. ^'The team you need for Series A is one team. Almost with every round, you need a slightly different set of skills. The person you'd hire pre Series A wouldn't be the right person for Series D. Accept that you need different teams for different phases.'`","His core principle on talent: ^'Always hire someone who you think is better than you. It's scary for some entrepreneurs, but I embrace that, because this is how you grow.'`"]},{title:"A 5K Island and Three Jerseys",beats:["#The beta launched in October 2014 with a single island called Jarvis, a real island in the South Pacific chosen specifically because it had no Strava segments. ^'We said, let's take this island. We know it's in the South Pacific. I don't see any Strava segments, so we can own that piece of land.'`","The map was only ^5 kilometers`. That was deliberate. ^'You want people to see each other. If you have a big map and they don't see each other, it doesn't feel communal. It doesn't feel social. It's fun when you bump into someone with a flag from Denmark or from China or from Australia. These are people you would never meet in the real world.'`","Jon had written code to generate the world through math. The road was a math equation. Trees placed randomly. A few hard coded buildings and a log cabin with a guy playing a banjo. No tools existed yet for artists to lay down roads.","There were exactly three rewards: a KOM jersey, a green sprint jersey, and an orange fastest lap jersey. Each reset every hour. No events. No racing mode. No training mode. You could only ride in one direction. ^'I think we started flipping the direction every few days. Tuesday was reverse day.'`","That was the entire product. ^'People showed up and loved chasing these things. So that was the beginning of Zwift.'`","13,000 people signed up for the beta in the first week. Eric remembers the first real milestone: ^'I got so excited when we saw 100 people riding together at the same time. We went to New York City and we celebrated.'`"]},{title:"200 Friends, 100 Checks",beats:["#That summer, before the beta, Eric threw a party for his Sakonnet investors to celebrate the success of the previous business. He used the gathering to pitch Zwift. Many investors from Sakonnet had made seven or eight times their money. ^'Many of them rolled their money into this new business.'`","He told his co founders the company was worth $20 million. They thought he was crazy. ^'I just came up with that number.'` Anyone who thought the number was insane was not invited to invest.","He pitched to 200 friends, family, and friends of friends. 100 invested. The plan was to raise $3 million. They raised ^$7 million`. ^'Once you have some momentum with investors, it's very easy to convince others. So I created this demand. Some of it is artificial.'`","Why the $20 million valuation mattered: ^'I'm glad we stuck with 20 because that's really helped us to protect the dilution of the business.'`","That $7 million lasted about 15 months. Eric went back on the road and raised another ^$10 million at a $100 million valuation`. Later came a Series C of ^$450 million`. Total capital raised: roughly half a billion dollars.","One co founder, Richard Sachs, a legendary frame builder who had beaten Eric in a race decades earlier, became an investor. ^'The social connections I still have with the sport go back so far. This is why cycling is such an important part of my life.'`"]},{title:"The Strava Growth Hack and the PR Firm",beats:["#The launch was simultaneous at Rapha stores in London, New York, and San Francisco. Team Sky riders showed up. Pinarello bikes were in the game. Wahoo and Elite provided hardware. Media covered all three locations live. ^'Looking back, I don't know what the hell I was thinking. But that's how ambitious we were.'`","They hired a PR firm before launch, not after. ^'One of the smart things we did in the beginning. Having all these brands on our platform gave it authenticity that we alone as a brand new brand couldn't do ourselves.'`","The real growth hack was simpler: Strava integration from day one. When riders uploaded from Jarvis Island, their Strava followers saw rides appearing in the South Pacific. ^'People asked me, I didn't know you were in the South Pacific. This is how people started to hear about Zwift.'`","Ted King, a professional cyclist, became their first ambassador. He was a big personality on Strava at the time. They sent him a large screen TV, a stand, and a trainer to his apartment in Girona, Spain. ^'We knew Strava would be a great channel for us. Let's work with Ted, have Ted start posting, and that piqued a lot of people's interest.'`","The community itself became the support team. ^'It wasn't us having to do all the customer support. It was Facebook groups from passionate Zwifters helping figure out what you need. My mate lives down the street and he'll come over and help sort you out.'`","Advertising never worked for them. ^'We've invested in traditional advertising over the years. It just doesn't work. It's not authentic. And it's very expensive. Working with Meta and YouTube is very expensive.'` Word of mouth from happy customers remained the most powerful channel."]},{title:"Consumers Are Extremely Lazy",beats:["#The barrier to entry was enormous. You needed a laptop, an ANT Plus dongle, a specific graphics card (Nvidia only on day one), a Wi Fi connection in your basement, and a compatible smart trainer. Only Windows at first. Only Wahoo Kickr and CompuTrainer supported.","Jon, the natural pessimist, doubted anyone would jump through that many hoops. ^'Are there really 50,000 people who want to hook up all these wires and figure out all the stuff they gotta buy just to pedal this bike?'`","It turned out people would, because being with other riders was worth the hassle. But friction never stopped being the main growth constraint.","Eric's central obsession, repeated across a decade of interviews: ^'Consumers are extremely lazy. If you give them three clicks to do, they may not buy something. You've got to get rid of those clicks.'`","His most specific example: the cassette problem. You buy a trainer. It comes with an 11 speed cassette. Your bike has a 7 speed. Now you carry a 40 pound trainer to a bike shop to have someone swap the cassette. ^'Talk about friction. This is the kind of story that would turn many softer consumers away from even trying Zwift.'`","This is why Zwift got into hardware. Not to compete with Wahoo or Tacx, but to simplify onboarding. Zwift became the only company letting consumers pick their cassette at checkout. Every $100 they reduced the cost of entry opened the market further. ^'If you're new to indoor cycling, you shouldn't have to spend more than $500.'`","The Android analogy, stated directly: ^'Android got started first, worked with Samsung and LG to create the ecosystem. Then Google decided to make their own phone as a reference product. Think of that as a model for us.'`"]},{title:"The Community Organized Itself",beats:["#The biggest surprise Eric never planned for: the community took ownership of Zwift in ways no business plan anticipated. ^'I never expected the community to be so engaged and so powerful.'`","Before Zwift had event tools, the community organized races using shared Google spreadsheets. They created their own schedules, their own rules, their own competitions, entirely outside the platform. ^'The community was doing off platform what we hadn't built on platform yet.'`","Racing itself was driven by community demand, not by Zwift's roadmap. ^'Of course I knew racing would eventually come. But the community really drove that. People are competitive. They want to ride with each other.'`","Eric had never worked in a consumer business before. ^'I'd always been in B2B. I never expected the level of detail and understanding the community would develop. But that's just happened over time.'`","The loudest users are not always right. ^'The risk is always listening to the loudest group. They may point you in the wrong direction. Most happy customers don't say anything. So you have to rely on the data about what people are actually doing and not doing.'`","His comparison to Peloton, stated as a strategic distinction: ^'If they're Apple, we're Android. Peloton would never allow their community to create their own content on their platform. We need to empower the community and give them more tools to help them create what they feel like they own.'`"]},{title:"COVID Doubled the Business",beats:["#Zwift had invested heavily in infrastructure before the pandemic, preparing for growth they expected to come gradually. COVID delivered it overnight. The business doubled. They peaked at over ^50,000 concurrent users` at one point.","^'We saw a huge rush of people coming in. These are people who wouldn't have considered indoor cycling, but were forced to because training was important. Being connected with one another was important.'`","It was a double edged sword. They hired 150 people on top of an existing 300, all remotely, and the product roadmap had to be frozen. ^'When you're doubling the business in a short period of time, it's all hands on deck to make sure customers are served.'`","Eric had told Yann LeMoyne, the CEO of ASO, months before that the Tour de France wasn't going to happen that year. Yann didn't believe him. ^'I told my team March Madness is not going to happen. They didn't believe me. It didn't happen. I told Yann the Tour is not going to happen. He didn't believe me. It didn't happen.'`","Eric proposed a virtual Tour de France. But he added one condition: women's racing had to be included, with equal distance, equal prize money, and equal broadcast coverage. ^'Knowing that if it's successful, it would be very difficult for them to not commit to doing a women's Tour de France going forward.'`","The virtual Tour de France was broadcast in over 100 countries. It led directly to the creation of the real ^Tour de France Femmes avec Zwift`, now four years running. Eric was at every stage of the most recent edition. ^'The crowds were insane. It was literally the men's Tour de France.'`","The pandemic also exposed a painful reality: many companies over invested during the boom and then collapsed. Zwift went through multiple cycles of restructuring to right size. ^'It's not a pleasant experience. I wouldn't wish that on anyone. But that was the whole market.'`"]},{title:"From Basements to the Olympics",beats:["#Zwift Academy was modeled after GT Academy, the Gran Turismo program that turned gamers into real racing drivers, some of whom went on to win Le Mans. Eric spoke to the production company that made GT Academy before building his own version.","The concept: use Zwift as a talent identification platform. Thousands of people participate for the structured training. Two winners per year, one man and one woman, receive professional cycling contracts in the real world.","They've been running it for five years. The talent level keeps rising. ^'Among the pro peloton, Zwift Academy is not a joke. We're finding real athletes now.'`","The proof point: ^Jay Vine`, a Zwift Academy winner from Australia, went on to win two stages of the Vuelta a Espana. He moved from his basement to Girona to the World Tour. ^'The idea that Zwift could be a platform to identify talent you otherwise wouldn't find, and then give him the opportunity to become a professional cyclist, that is what people get super excited about.'`","Multiple Zwift Academy graduates ended up on the Canyon SRAM women's team, staying for multiple seasons, not just one year deals. Ella Harris from New Zealand is in her third season.","Eric's long term ambition, stated repeatedly over eight years: cycling eSports and Super League Triathlon arena games should become Olympic sports. They've already hosted three official UCI cycling eSports World Championships. ^'I do believe that this kind of activity will make its way into the Olympics. I hope, fingers crossed, for the 2028 LA Olympics.'`"]},{title:"It Takes 10 Years to Build a Business",beats:["#Eric used to obsess over real time user numbers, sharing a live dashboard with his board. He stopped. ^'We had this app that we shared with our board members. We got rid of it because we realized this is not healthy. It's like watching a stock ticker every minute. I get the numbers once a month now. That's fine.'`","Zwift now has roughly ^300 to 350 employees`, with offices in Long Beach, London, and Rio de Janeiro. Eric moved from London to the Cotswolds during COVID, then to Santa Monica in 2022, to be closer to headquarters.","Jon Mayfield, the co founder who built the original engine, transitioned out of running the product team in 2020. He moved into an R&D role, operating like a mini startup within Zwift, trying things that are years away. ^'I never actually wanted us to get this big. I just want to build something cool for people that like bikes.'`","Jon's most honest reflection on what he built: ^'I was at a home repair store and this lady had a little bike badge on her name tag. She told me her friend got hit by a car three months ago and they started riding on this software. She knew who I was. She was like, wait, are you Jon? This has totally helped us through our recovery.'`","Eric's proudest metric is not revenue or valuation. People who Zwift regularly end up riding more outdoors, because they're fitter. ^'If you're fit when you go outdoors, you have more fun. That's what brings people back.'`","His advice to anyone considering starting a company: ^'It takes five years to validate a business. It takes 10 years to build a business. Do you have the stomach for that? Because that's a lot of opportunity cost. And then you might have to work another five years to turn it into a sustainable, successful business. That is not for everyone.'`","^'Everyone needs luck. You need luck and you need support from your friends and family. You cannot do this by yourself.'`","=This story was assembled by <b>Andres Vanryckeghem</b>, founder of <b>Athlete Founders</b>. He analyses athlete entrepreneurs every day to help other athletes see the possibilities of their own projects, and to make their first steps very concrete based on all these learnings."]},]},o=["The Racer","JP Morgan","Sakonnet","The Problem","Choosing Cycling","Jon Mayfield","The Partnership","Day One","Hiring","The MVP","Raising Capital","Getting to Market","Friction","Community","The Pandemic","Zwift Academy","The Long Game"],a=0,i=0,r="intro",s=[],d={},l=0;t.innerHTML='<style>@import url(\'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap\');*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:host{display:block;width:100%;--a:rgba(255,255,255,.05);--b:rgba(255,255,255,.1);--c:rgba(255,255,255,.3);--d:rgba(255,255,255,.025);--e:rgba(255,255,255,.08);--f:rgba(255,255,255,.25);--g:rgba(255,255,255,.07);--h:rgba(255,255,255,.5);--i:rgba(255,255,255,.75);--j:rgba(255,255,255,.45);--k:rgba(255,255,255,.04);--l:rgba(255,255,255,.12);--m:rgba(255,255,255,.09);--n:rgba(255,255,255,.4);--o:rgba(255,255,255,.15);--p:rgba(255,255,255,.7);--q:rgba(255,255,255,.2);--A:rgba(252,103,25,.6);--B:rgba(252,103,25,.3);--C:rgba(252,103,25,.4);--D:rgba(252,103,25,.5);--E:rgba(252,103,25,.12);--F:rgba(252,103,25,.06);--G:rgba(252,103,25,.7);--H:rgba(252,103
